<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 340" width="910" height="340" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><rect width="910" height="340" fill="#ffffff"/><text x="20" y="30" font-size="11" font-weight="700" letter-spacing="1" fill="#b8862b">RECORDING  (only cameras with faces enabled)</text><rect x="20" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="85.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Tracked person</text><text x="85.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">checked every 1 s</text><text x="85.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">by the main detector</text><rect x="170" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="235.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Top 60 % crop</text><text x="235.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">where the head is;</text><text x="235.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">main stream if available</text><rect x="320" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="385.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">YuNet</text><text x="385.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">face box +</text><text x="385.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">5 landmarks</text><rect x="470" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="535.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Align</text><text x="535.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">straightened,</text><text x="535.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">112 × 112 px</text><rect x="620" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="685.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">SFace</text><text x="685.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">128-number</text><text x="685.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">face print</text><rect x="770" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="835.0" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Quality check</text><text x="835.0" y="84" text-anchor="middle" font-size="11" fill="#5b6675">≥ 32 px, sharp, facing;</text><text x="835.0" y="99" text-anchor="middle" font-size="11" fill="#5b6675">otherwise skipped</text><path d="M152,80 H168" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M302,80 H318" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M452,80 H468" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M602,80 H618" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M752,80 H768" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M380,150 v40 a75,11 0 0 0 150,0 v-40" fill="#fbf6ec" stroke="#b8862b"/><ellipse cx="455" cy="150" rx="75" ry="11" fill="#fbf6ec" stroke="#b8862b"/><text x="455" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Face store</text><text x="455" y="194" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">best 5 faces per visit, 7 days</text><path d="M835,118 V170 H534" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="236" font-size="11" font-weight="700" letter-spacing="1" fill="#b8862b">SEARCH BY PHOTO</text><rect x="20" y="250" width="150" height="72" rx="8" fill="#ffffff" stroke="#d9dee5"/><text x="95.0" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Uploaded photo</text><text x="95.0" y="290" text-anchor="middle" font-size="11" fill="#5b6675">one or more photos</text><text x="95.0" y="305" text-anchor="middle" font-size="11" fill="#5b6675">of the same person</text><rect x="200" y="250" width="150" height="72" rx="8" fill="#ffffff" stroke="#d9dee5"/><text x="275.0" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Same four steps</text><text x="275.0" y="290" text-anchor="middle" font-size="11" fill="#5b6675">detect, align, print, check;</text><text x="275.0" y="305" text-anchor="middle" font-size="11" fill="#5b6675">refused with the reason</text><rect x="380" y="250" width="150" height="72" rx="8" fill="#ffffff" stroke="#d9dee5"/><text x="455.0" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Compare</text><text x="455.0" y="290" text-anchor="middle" font-size="11" fill="#5b6675">cosine similarity with</text><text x="455.0" y="305" text-anchor="middle" font-size="11" fill="#5b6675">every stored print</text><rect x="560" y="250" width="150" height="72" rx="8" fill="#ffffff" stroke="#d9dee5"/><text x="635.0" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Group into visits</text><text x="635.0" y="290" text-anchor="middle" font-size="11" fill="#5b6675">score = mean of the</text><text x="635.0" y="305" text-anchor="middle" font-size="11" fill="#5b6675">visit's best 3 matches</text><rect x="740" y="250" width="150" height="72" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="815.0" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Answer</text><text x="815.0" y="290" text-anchor="middle" font-size="11" fill="#5b6675">likely / possible,</text><text x="815.0" y="305" text-anchor="middle" font-size="11" fill="#5b6675">with face thumbnails</text><path d="M172,286 H198" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M352,286 H378" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M532,286 H558" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M712,286 H738" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M455,204 V248" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/></svg>