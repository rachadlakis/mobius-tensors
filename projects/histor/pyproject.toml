[project]
name = "histor"
version = "0.1.0"
description = "Record everything the cameras see as searchable embeddings, then ask about it"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps of the object-detection modules Histor reuses (detector, tracker, CLIP, store).
dependencies = [
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
