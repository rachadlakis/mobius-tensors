<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-label="One change analysis per camera and frame, read by moving-thing search, fire, still items and scene changes">
<style>
:root { --t: #888780; }
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.chip { fill: #FFFFFF; stroke: #E5E3DC; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.dash { stroke: #B4B2A9; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-amber > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-coral > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral > .th { fill: #712B13; } .c-coral > .ts { fill: #993C1D; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
</style>
<rect width="680" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- the frame -->
<rect class="box" x="230" y="24" width="220" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Camera frame</text>
<text class="ts" x="340" y="61" text-anchor="middle" dominant-baseline="central">one camera, every frame</text>
<line x1="340" y1="76" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<!-- the one analysis -->
<rect class="box" x="40" y="106" width="600" height="168" rx="10" stroke-width="0.5"/>
<text class="th" x="60" y="130" dominant-baseline="central">Change analysis, once per frame</text>
<g class="c-gray"><rect x="478" y="116" width="148" height="28" rx="14" stroke-width="0.5"/>
<text class="ts" x="552" y="130" text-anchor="middle" dominant-baseline="central">2.5 ms (1280×720)</text></g>
<rect class="chip" x="60" y="156" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="150" y="172" text-anchor="middle" dominant-baseline="central">Small copy</text>
<text class="ts" x="150" y="190" text-anchor="middle" dominant-baseline="central">320 px, colour and grey</text>
<rect class="chip" x="250" y="156" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central">Shake lined up</text>
<text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">a turned camera: start again</text>
<rect class="chip" x="440" y="156" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="530" y="172" text-anchor="middle" dominant-baseline="central">Fast background</text>
<text class="ts" x="530" y="190" text-anchor="middle" dominant-baseline="central">leaves, water learned</text>
<rect class="chip" x="60" y="212" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="150" y="228" text-anchor="middle" dominant-baseline="central">Light guard</text>
<text class="ts" x="150" y="246" text-anchor="middle" dominant-baseline="central">clouds, lamps switched on</text>
<rect class="chip" x="250" y="212" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">Flicker</text>
<text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">changed since the last frame</text>
<rect class="chip" x="440" y="212" width="180" height="46" rx="6" stroke-width="0.5"/>
<text class="th" x="530" y="228" text-anchor="middle" dominant-baseline="central">Warm and bright</text>
<text class="ts" x="530" y="246" text-anchor="middle" dominant-baseline="central">red, orange, yellow; infrared</text>

<!-- fan out -->
<path d="M340 274 L340 290 L106 290 L106 314" class="arr" marker-end="url(#arrow)"/>
<path d="M340 290 L262 290 L262 314" class="dash" marker-end="url(#arrow)"/>
<path d="M340 290 L418 290 L418 314" class="dash" marker-end="url(#arrow)"/>
<path d="M340 290 L574 290 L574 314" class="dash" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="36" y="316" width="140" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="106" y="336" text-anchor="middle" dominant-baseline="central">Moving things</text>
<text class="ts" x="106" y="356" text-anchor="middle" dominant-baseline="central">search: carts,</text>
<text class="ts" x="106" y="372" text-anchor="middle" dominant-baseline="central">drones, thrown things</text></g>
<g class="c-coral"><rect x="192" y="316" width="140" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="336" text-anchor="middle" dominant-baseline="central">Fire</text>
<text class="ts" x="262" y="356" text-anchor="middle" dominant-baseline="central">flicker trigger,</text>
<text class="ts" x="262" y="372" text-anchor="middle" dominant-baseline="central">motion per spot</text></g>
<g class="c-amber"><rect x="348" y="316" width="140" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="418" y="336" text-anchor="middle" dominant-baseline="central">New still items</text>
<text class="ts" x="418" y="356" text-anchor="middle" dominant-baseline="central">a box left,</text>
<text class="ts" x="418" y="372" text-anchor="middle" dominant-baseline="central">a ladder set down</text></g>
<g class="c-purple"><rect x="504" y="316" width="140" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="574" y="336" text-anchor="middle" dominant-baseline="central">Scene changes</text>
<text class="ts" x="574" y="356" text-anchor="middle" dominant-baseline="central">index the view</text>
<text class="ts" x="574" y="372" text-anchor="middle" dominant-baseline="central">when it changes</text></g>
<line x1="60" y1="418" x2="96" y2="418" class="arr"/>
<text class="ts" x="104" y="418" dominant-baseline="central">reads it today</text>
<line x1="220" y1="418" x2="256" y2="418" class="dash"/>
<text class="ts" x="264" y="418" dominant-baseline="central">next steps (see Next); camera tamper reuses its grey copy</text>
</svg>
