<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="A question is split into what, when and which camera; the what becomes a CLIP text vector compared with the stored image vectors in that time and camera; matches of the same tracked object become one visit">
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.thumb { fill: #ffffff; stroke: #B4B2A9; stroke-width: 0.5; }
.van { fill: #FAF9F5; stroke: #2C2C2A; stroke-width: 1; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-amber > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <g id="vthumb"><rect class="thumb" width="46" height="30" rx="2"/><line x1="2" y1="24" x2="44" y2="24" stroke="#B4B2A9" stroke-width="0.5"/>
    <rect class="van" x="8" y="10" width="26" height="12" rx="2"/><rect class="van" x="30" y="13" width="8" height="9" rx="1"/><circle class="van" cx="14" cy="23" r="2.5"/><circle class="van" cx="32" cy="23" r="2.5"/></g>
</defs>
<rect width="680" height="380" fill="#ffffff"/>

<rect class="box" x="140" y="20" width="400" height="44" rx="22" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">"white van at the gate yesterday evening"</text>
<path class="arr" d="M340 64 L340 78 L130 78 L130 92" marker-end="url(#arrow)"/>
<path class="arr" d="M340 78 L340 92" marker-end="url(#arrow)"/>
<path class="arr" d="M340 78 L550 78 L550 92" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="94" width="180" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="110" text-anchor="middle" dominant-baseline="central">What</text>
<text class="ts" x="130" y="128" text-anchor="middle" dominant-baseline="central">"white van" → CLIP text</text></g>
<g class="c-amber"><rect x="250" y="94" width="180" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">When</text>
<text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">yesterday 17:00–21:00</text></g>
<g class="c-teal"><rect x="460" y="94" width="180" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="110" text-anchor="middle" dominant-baseline="central">Camera</text>
<text class="ts" x="550" y="128" text-anchor="middle" dominant-baseline="central">gate (or an alias)</text></g>
<path class="arr" d="M130 142 L130 168" marker-end="url(#arrow)"/><path class="arr" d="M340 142 L340 168" marker-end="url(#arrow)"/><path class="arr" d="M550 142 L550 168" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="170" width="600" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="56" y="190">Stored image vectors in that time, on that camera, ranked</text>
<g transform="translate(56,204)"><use href="#vthumb"/><text class="tx" x="23" y="42" text-anchor="middle">0.31 · #12</text></g>
<g transform="translate(116,204)"><use href="#vthumb"/><text class="tx" x="23" y="42" text-anchor="middle">0.30 · #12</text></g>
<g transform="translate(176,204)"><use href="#vthumb"/><text class="tx" x="23" y="42" text-anchor="middle">0.29 · #12</text></g>
<g transform="translate(250,204)"><use href="#vthumb"/><text class="tx" x="23" y="42" text-anchor="middle">0.27 · #40</text></g>
<g transform="translate(310,204)"><use href="#vthumb"/><text class="tx" x="23" y="42" text-anchor="middle">0.26 · #40</text></g>
<g transform="translate(384,204)"><rect class="thumb" width="46" height="30" rx="2"/><rect x="6" y="6" width="34" height="18" fill="none" stroke="#B4B2A9" stroke-dasharray="2 2"/><text class="tx" x="23" y="42" text-anchor="middle">0.22 · scene</text></g>
<text class="tx" x="450" y="214">#12, #40: tracked objects</text>
<text class="tx" x="450" y="228">scene / tile / motion:</text>
<text class="tx" x="450" y="240">no track, merged by time</text>
<path class="arr" d="M340 254 L340 280" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="40" y="282" width="290" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="302" text-anchor="middle" dominant-baseline="central">Visit 1 · van #12</text>
<text class="ts" x="185" y="322" text-anchor="middle" dominant-baseline="central">gate 19:42–19:44, best thumbnail, 3 matches</text></g>
<g class="c-teal"><rect x="350" y="282" width="290" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="302" text-anchor="middle" dominant-baseline="central">Visit 2 · van #40</text>
<text class="ts" x="495" y="322" text-anchor="middle" dominant-baseline="central">gate 20:35, 2 matches</text></g>
<text class="tx" x="40" y="366">Scores are ranks, not certainties: check the thumbnails. One van passing for 40 s is one answer, not twenty.</text>
</svg>
