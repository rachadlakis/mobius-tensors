<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-label="An area raises enter, exit, dwell after 60 seconds and crowd; a line raises cross with a direction, and a one-way line is a wrong-way alarm">
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.scene { stroke: #888780; stroke-width: 1; fill: none; }
.zone { fill: #E1F5EE; fill-opacity: 0.7; stroke: #0F6E56; stroke-width: 1.5; }
.line { stroke: #534AB7; stroke-width: 2.5; stroke-linecap: round; }
.person { stroke: #2C2C2A; stroke-width: 1.4; stroke-linecap: round; fill: none; }
.path { stroke: #D85A30; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
.car { fill: #FAF9F5; stroke: #2C2C2A; stroke-width: 1.2; }
</style>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="tip-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <g id="walker"><circle cx="0" cy="-22" r="3.5"/><line x1="0" y1="-18" x2="0" y2="-6"/><line x1="0" y1="-6" x2="-4" y2="2"/><line x1="0" y1="-6" x2="4" y2="2"/><line x1="-5" y1="-14" x2="5" y2="-14"/></g>
</defs>
<rect width="680" height="330" fill="#ffffff"/>

<!-- area -->
<text class="th" x="40" y="26">Area: a zone of the picture</text>
<g transform="translate(40,40)">
<rect class="box" width="290" height="170" rx="4" stroke-width="0.5"/>
<g class="scene"><line x1="0" y1="150" x2="290" y2="150"/><rect x="200" y="30" width="70" height="120"/><rect x="214" y="96" width="22" height="54"/></g>
<polygon class="zone" points="30,96 180,86 196,160 20,164"/>
<text class="tx" x="40" y="108" fill="#0F6E56">yard</text>
<path class="path" d="M8 140 C40 136 60 132 84 128" marker-end="url(#tip)"/>
<g class="person" transform="translate(100,130)"><use href="#walker"/></g>
<g class="person" transform="translate(150,146)"><use href="#walker"/></g>
<text class="tx" x="10" y="124" fill="#D85A30">enter</text>
<text class="tx" x="70" y="40" fill="#D85A30">dwell: still inside after 60 s</text>
<line x1="130" y1="44" x2="148" y2="116" stroke="#D85A30" stroke-width="0.8"/></g>
<text class="ts" x="40" y="232">enter / exit, dwell after <tspan font-weight="500">dwell_seconds</tspan>,</text>
<text class="ts" x="40" y="248">crowd: more than <tspan font-weight="500">max_count</tspan> inside (queues).</text>
<text class="ts" x="40" y="264">No points: anywhere in the picture.</text>

<!-- line -->
<text class="th" x="370" y="26">Line: a gate or a door</text>
<g transform="translate(350,40)">
<rect class="box" width="290" height="170" rx="4" stroke-width="0.5"/>
<g class="scene"><line x1="0" y1="150" x2="290" y2="150"/><line x1="0" y1="110" x2="290" y2="110"/><rect x="128" y="40" width="8" height="70"/><rect x="152" y="40" width="8" height="70"/></g>
<line class="line" x1="144" y1="100" x2="144" y2="160"/>
<text class="tx" x="166" y="100" fill="#534AB7">gate_line</text>
<g transform="translate(60,122)"><rect class="car" width="54" height="20" rx="4"/><rect class="car" x="10" y="-10" width="30" height="12" rx="3"/><circle class="car" cx="12" cy="22" r="5"/><circle class="car" cx="42" cy="22" r="5"/></g>
<path class="path" d="M118 134 L200 134" marker-end="url(#tip)"/>
<text class="tx" x="206" y="138" fill="#D85A30">cross: in</text>
<path d="M190 28 L244 28" stroke="#534AB7" stroke-width="1.2" fill="none" marker-end="url(#tip-p)"/>
<text class="tx" x="190" y="20" fill="#534AB7">direction: in</text></g>
<text class="ts" x="370" y="232">cross, with the direction (in / out).</text>
<text class="ts" x="370" y="248">One-way (<tspan font-weight="500">direction: in</tspan>): crossing out is</text>
<text class="ts" x="370" y="264">a wrong-way alarm.</text>

<g transform="translate(40,282)"><rect class="box" width="600" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="300" y="17" text-anchor="middle" dominant-baseline="central">Drawn by clicking on a frame in the test bench (Zones &amp; lines tab), points as shares of the picture.</text></g>
</svg>
