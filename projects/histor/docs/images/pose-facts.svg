<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="About once a second each person's 17 keypoints become exact facts: posture, arms, facing, head, motion, what they carry, colour of top and trousers; the chat filters people by them">
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.bone { stroke: #534AB7; stroke-width: 2; stroke-linecap: round; }
.kp { fill: #ffffff; stroke: #534AB7; stroke-width: 1.5; }
.key { font-size: 12px; fill: #5F5E5A; }
.val { font-size: 12px; font-weight: 500; fill: #085041; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="360" fill="#ffffff"/>

<text class="th" x="40" y="26">About once a second, per person: 17 keypoints → exact facts</text>

<!-- the person: walking towards the camera, right hand up, backpack, red top, blue trousers -->
<rect class="box" x="40" y="42" width="200" height="236" rx="8" stroke-width="0.5"/>
<line x1="52" y1="262" x2="228" y2="262" stroke="#B4B2A9" stroke-width="1"/>
<rect x="104" y="96" width="22" height="46" rx="5" fill="#E8E6DF" stroke="#888780" stroke-width="1"/>
<path d="M118 92 L162 92 L166 160 L114 160 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<path d="M116 160 L164 160 L170 254 L150 254 L140 186 L130 254 L110 254 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<circle cx="140" cy="64" r="13" fill="#FAF9F5" stroke="#888780" stroke-width="1"/>
<g class="bone">
  <line x1="140" y1="78" x2="140" y2="93"/>
  <line x1="120" y1="94" x2="160" y2="94"/>
  <line x1="120" y1="94" x2="116" y2="160"/><line x1="160" y1="94" x2="164" y2="160"/>
  <line x1="116" y1="160" x2="164" y2="160"/>
  <line x1="120" y1="94" x2="102" y2="128"/><line x1="102" y1="128" x2="96" y2="160"/>
  <line x1="160" y1="94" x2="180" y2="76"/><line x1="180" y1="76" x2="186" y2="54"/>
  <line x1="116" y1="160" x2="124" y2="206"/><line x1="124" y1="206" x2="120" y2="252"/>
  <line x1="164" y1="160" x2="160" y2="206"/><line x1="160" y1="206" x2="166" y2="252"/>
</g>
<g class="kp">
  <circle cx="140" cy="64" r="3.5"/><circle cx="134" cy="60" r="2.5"/><circle cx="146" cy="60" r="2.5"/><circle cx="128" cy="64" r="2.5"/><circle cx="152" cy="64" r="2.5"/>
  <circle cx="120" cy="94" r="3.5"/><circle cx="160" cy="94" r="3.5"/><circle cx="102" cy="128" r="3.5"/><circle cx="180" cy="76" r="3.5"/>
  <circle cx="96" cy="160" r="3.5"/><circle cx="186" cy="54" r="3.5"/><circle cx="116" cy="160" r="3.5"/><circle cx="164" cy="160" r="3.5"/>
  <circle cx="124" cy="206" r="3.5"/><circle cx="160" cy="206" r="3.5"/><circle cx="120" cy="252" r="3.5"/><circle cx="166" cy="252" r="3.5"/>
</g>
<text class="tx" x="140" y="292" text-anchor="middle">ViTPose-B, on each tracked person</text>

<line class="arr" x1="248" y1="160" x2="290" y2="160" marker-end="url(#arrow)"/>

<!-- the facts -->
<rect class="box" x="296" y="42" width="344" height="236" rx="8" stroke-width="0.5"/>
<g transform="translate(312,48)">
<text class="key" x="0" y="24">posture</text><text class="val" x="92" y="24">standing</text><text class="tx" x="176" y="24">sitting, crouching, bending, lying</text>
<text class="key" x="0" y="52">arms</text><text class="val" x="92" y="52">one_up</text><text class="tx" x="176" y="52">down, both_up</text>
<text class="key" x="0" y="80">facing</text><text class="val" x="92" y="80">camera</text><text class="tx" x="176" y="80">side, away</text>
<text class="key" x="0" y="108">head</text><text class="val" x="92" y="108">up</text><text class="tx" x="176" y="108">down (on a phone?)</text>
<text class="key" x="0" y="136">motion</text><text class="val" x="92" y="136">walking</text><text class="tx" x="176" y="136">still, running</text>
<text class="key" x="0" y="164">carrying</text><text class="val" x="92" y="164">backpack</text><text class="tx" x="176" y="164">handbag, suitcase, umbrella</text>
<text class="key" x="0" y="192">top</text><text class="val" x="92" y="192">red</text><text class="tx" x="176" y="192">from the torso's pixels</text>
<text class="key" x="0" y="220">trousers</text><text class="val" x="92" y="220">blue</text><text class="tx" x="176" y="220">grey at night (infrared)</text>
</g>

<g class="c-teal"><rect x="40" y="302" width="600" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Exact answers, not CLIP's ranked guesses: "anyone lying on the floor", "hands up at the till",</text>
<text class="ts" x="340" y="334" text-anchor="middle" dominant-baseline="central">"someone running", "red top, blue trousers". A row is stored on each change, so time in each posture is known.</text></g>
</svg>
