<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="The chat: the model calls tools on the store as many times as the question needs, at most 6 rounds, looks at the thumbnails with the local vision model, then answers with the evidence">
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #3C3489; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.thumb { fill: #ffffff; stroke: #B4B2A9; stroke-width: 0.5; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <g id="pthumb"><rect class="thumb" width="40" height="30" rx="2"/><line x1="2" y1="25" x2="38" y2="25" stroke="#B4B2A9" stroke-width="0.5"/>
    <g stroke="#2C2C2A" stroke-width="1.1" stroke-linecap="round" fill="none"><circle cx="16" cy="8" r="2.5"/><line x1="16" y1="11" x2="16" y2="18"/><line x1="16" y1="18" x2="13" y2="24"/><line x1="16" y1="18" x2="19" y2="24"/></g>
    <rect x="20" y="15" width="9" height="9" rx="1" fill="#E8E6DF" stroke="#2C2C2A" stroke-width="0.8"/></g>
</defs>
<rect width="680" height="420" fill="#ffffff"/>

<!-- question -->
<rect class="box" x="40" y="20" width="420" height="40" rx="20" stroke-width="0.5"/>
<text class="th" x="250" y="40" text-anchor="middle" dominant-baseline="central">"Did anyone come in with a suitcase this morning?"</text>
<line class="arr" x1="250" y1="60" x2="250" y2="86" marker-end="url(#arrow)"/>

<!-- the model -->
<g class="c-purple"><rect x="40" y="88" width="420" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="250" y="106" text-anchor="middle" dominant-baseline="central">Chat model (local by default)</text>
<text class="ts" x="250" y="124" text-anchor="middle" dominant-baseline="central">decides which lookups the question needs</text></g>

<!-- tool rounds -->
<rect class="box" x="40" y="160" width="420" height="152" rx="8" stroke-width="0.5"/>
<text class="tx" x="52" y="176">round 1</text>
<text class="code" x="52" y="194">people(carrying=["suitcase"], when="this morning")</text>
<text class="ts" x="64" y="214">→ 1 person, lobby, 08:12–08:13</text>
<line x1="52" y1="226" x2="448" y2="226" stroke="#E5E3DC" stroke-width="1"/>
<text class="tx" x="52" y="242">round 2</text>
<text class="code" x="52" y="260">look(images=[lobby_0812.jpg], question="A suitcase?")</text>
<text class="ts" x="64" y="280">→ "Yes, a black wheeled suitcase."</text>
<text class="tx" x="64" y="298">look: the local vision model reads the thumbnail</text>
<path class="arr" d="M40 236 L24 236 L24 114 L38 114" marker-end="url(#arrow)"/>
<text class="tx" x="18" y="180" text-anchor="middle" transform="rotate(-90 18 180)">results back</text>
<path class="arr" d="M250 140 L250 158" marker-end="url(#arrow)"/>

<!-- tools / store -->
<rect class="box" x="490" y="88" width="150" height="224" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="110" text-anchor="middle" dominant-baseline="central">Tools on the store</text>
<g class="ts" text-anchor="middle"><text x="565" y="136">objects</text><text x="565" y="156">search (CLIP)</text><text x="565" y="176">alerts</text><text x="565" y="196">people (pose)</text><text x="565" y="216">plates</text><text x="565" y="236">face (opt-in)</text><text x="565" y="256">look (vision)</text></g>
<text class="tx" x="565" y="284" text-anchor="middle">all take a time range</text>
<text class="tx" x="565" y="298" text-anchor="middle">and a camera</text>
<path class="arr" d="M460 236 L488 236" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line class="arr" x1="250" y1="312" x2="250" y2="330" marker-end="url(#arrow)"/>

<!-- answer -->
<g class="c-teal"><rect x="40" y="332" width="600" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="56" y="354">Yes: one person in the lobby at 08:12, with a black wheeled suitcase.</text>
<text class="ts" x="56" y="378">Evidence:</text>
<g transform="translate(118,362)"><use href="#pthumb"/></g>
<text class="tx" x="170" y="380">the thumbnails it looked at, to check</text>
<text class="tx" x="624" y="378" text-anchor="end">at most 6 rounds, then it must answer</text></g>
</svg>
