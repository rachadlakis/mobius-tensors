<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-label="Every few seconds the whole frame and four overlapping tiles are embedded; in a tile a small ladder is 1.6 times larger in the 224 by 224 image CLIP sees">
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.scene { stroke: #888780; stroke-width: 1; fill: none; }
.ladder { stroke: #BA7517; stroke-width: 1.6; stroke-linecap: round; }
.tile { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; }
.hit { fill: none; stroke: #1D9E75; stroke-width: 1.6; stroke-dasharray: 4 3; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.pad { fill: #EFEDE6; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <!-- the street, 280 x 158 -->
  <g id="view">
    <rect class="box" width="280" height="158" rx="4" stroke-width="0.5"/>
    <g class="scene"><line x1="0" y1="130" x2="280" y2="130"/>
      <rect x="20" y="40" width="70" height="90"/><rect x="32" y="56" width="16" height="16"/><rect x="60" y="56" width="16" height="16"/><rect x="46" y="100" width="18" height="30"/>
      <line x1="130" y1="130" x2="130" y2="34"/><rect x="118" y="34" width="24" height="14"/>
      <rect x="170" y="70" width="80" height="60"/><polyline points="170,70 210,46 250,70"/></g>
    <g class="ladder"><line x1="200" y1="130" x2="207" y2="104"/><line x1="208" y1="130" x2="215" y2="104"/><line x1="202" y1="123" x2="210" y2="123"/><line x1="204" y1="116" x2="212" y2="116"/><line x1="206" y1="110" x2="214" y2="110"/></g>
  </g>
  <clipPath id="tile4"><rect x="105" y="59.25" width="175" height="98.75"/></clipPath>
</defs>
<rect width="680" height="330" fill="#ffffff"/>

<text class="th" x="40" y="26">Every 5 s: whole frame + 4 tiles</text>
<g transform="translate(40,44)"><use href="#view"/>
<rect class="tile" x="1" y="1" width="174" height="98"/>
<rect class="tile" x="105" y="1" width="174" height="98"/>
<rect class="tile" x="1" y="59" width="174" height="98"/>
<rect class="hit" x="105" y="59" width="174" height="98"/>
<text class="tx" x="272" y="152" text-anchor="end" fill="#0F6E56">tile 4</text></g>
<text class="ts" x="40" y="222">Each tile: a quarter of the frame, 25% bigger</text>
<text class="ts" x="40" y="238">on each side, so nothing on a border is cut</text>
<text class="ts" x="40" y="254">in half. 5 vectors per sample.</text>

<!-- what CLIP sees: padded to a square, 224 x 224 (drawn 120 x 120) -->
<text class="th" x="370" y="26">What CLIP sees (224 × 224)</text>
<g transform="translate(370,44)">
<rect class="pad" width="120" height="120" rx="3"/>
<g transform="translate(0,26.25) scale(0.4286)"><use href="#view"/></g>
<text class="ts" x="60" y="140" text-anchor="middle">whole frame</text>
<text class="tx" x="60" y="156" text-anchor="middle">ladder ~21 px tall</text></g>
<line class="arr" x1="498" y1="104" x2="522" y2="104" marker-end="url(#arrow)"/>
<g transform="translate(530,44)">
<rect class="pad" width="120" height="120" rx="3"/>
<g transform="translate(0,26.25) scale(0.6857) translate(-105,-59.25)"><g clip-path="url(#tile4)"><use href="#view"/></g></g>
<rect class="hit" x="0.8" y="26.25" width="118.4" height="67.7"/>
<text class="ts" x="60" y="140" text-anchor="middle">tile 4</text>
<text class="tx" x="60" y="156" text-anchor="middle">ladder ~33 px: 1.6× larger</text></g>

<text class="ts" x="370" y="222">Padded to a square, never cropped: a tall</text>
<text class="ts" x="370" y="238">person keeps head and feet.</text>

<g transform="translate(40,272)">
<rect class="box" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="ts" x="300" y="17" text-anchor="middle" dominant-baseline="central">A search for "ladder against the wall" matches tile 4 better than the whole frame:</text>
<text class="ts" x="300" y="33" text-anchor="middle" dominant-baseline="central">small things the detector has no class for stay findable.</text></g>
</svg>
