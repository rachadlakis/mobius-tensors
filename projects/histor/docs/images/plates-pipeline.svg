<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="290" fill="#ffffff"/><defs><marker id="a5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ab8862b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8862b"/></marker><marker id="ac05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs><text x="20" y="26" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">EACH TRACKED VEHICLE, ABOUT ONCE A SECOND, ON ITS OWN THREAD</text><rect x="20" y="44" width="140" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="90.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Vehicle track</text><text x="90.0" y="81.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">car, truck, bus,</text><text x="90.0" y="96.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">motorcycle; hi-res crop</text><text x="90.0" y="111.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">from the keyframe</text><rect x="190" y="44" width="150" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="265.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Plate finder</text><text x="265.0" y="81.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">YOLOv9-t 384 (trials)</text><text x="265.0" y="96.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">→ our YOLOX (to train)</text><text x="265.0" y="111.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">~11 ms</text><rect x="370" y="44" width="140" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="440.0" y="72.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Plate crop</text><text x="440.0" y="89.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">resized to</text><text x="440.0" y="104.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">128 × 64</text><rect x="540" y="44" width="150" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="615.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Plate reader</text><text x="615.0" y="81.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">fast-plate-ocr CCT-S,</text><text x="615.0" y="96.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">10 slots × 37 chars,</text><text x="615.0" y="111.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">~10 ms</text><rect x="720" y="44" width="120" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="780.0" y="72.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Read</text><text x="780.0" y="89.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">kept if every</text><text x="780.0" y="104.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">character ≥ 0.6</text><rect x="870" y="44" width="110" height="80" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="925.0" y="64.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Vote</text><text x="925.0" y="81.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">highest summed</text><text x="925.0" y="96.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">confidence per</text><text x="925.0" y="111.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">vehicle</text><path d="M160,84.0 L188,84.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M340,84.0 L368,84.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M510,84.0 L538,84.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M690,84.0 L718,84.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M840,84.0 L868,84.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="400" y="175" width="180" height="90" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="490.0" y="200.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">plates table</text><text x="490.0" y="217.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">a row per new text or</text><text x="490.0" y="232.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">clearly better read,</text><text x="490.0" y="247.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">≤ 5 per vehicle, with crop</text><rect x="610" y="175" width="180" height="90" rx="8" fill="#fff" stroke="#d9dee5"/><text x="700.0" y="200.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Search</text><text x="700.0" y="217.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">plates tool, GET /plates;</text><text x="700.0" y="232.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">look-alikes equal (0/O/D/Q,</text><text x="700.0" y="247.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">1/I/L, 8/B…) + 1 typo</text><rect x="820" y="175" width="160" height="90" rx="8" fill="#fff" stroke="#d9dee5"/><text x="900.0" y="200.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Watchlist</text><text x="900.0" y="217.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">voted plate read twice</text><text x="900.0" y="232.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">matches → `plate` alert</text><text x="900.0" y="247.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">(once per vehicle)</text><path d="M925.0,124 V150 H490 V173" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M925.0,124 V150 H700 V173" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M925.0,124 V173" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><text x="200" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">Off by default: plates are</text><text x="200" y="215" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">personal data in many countries;</text><text x="200" y="230" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">own retention (plate_retention_days).</text></svg>