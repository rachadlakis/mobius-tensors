<svg xmlns="http://www.w3.org/2000/svg" width="680" height="546" viewBox="0 0 680 546" role="img" aria-label="Filter chain from camera frame to moving thing or new still item; the first steps are the shared change analysis">
<style>
:root { --t: #888780; }
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.shared { fill: none; stroke: #534AB7; stroke-width: 1; stroke-dasharray: 5 4; }
.sh { font-size: 12px; font-weight: 500; fill: #3C3489; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-amber > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
</style>
<rect width="680" height="546" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="210" y="40" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Camera frame</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">small copy, 320 px</text>
<line x1="340" y1="96" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<rect class="shared" x="196" y="112" width="458" height="250" rx="12"/>
<text class="sh" x="28" y="130" dominant-baseline="central">Shared change analysis</text>
<text class="ts" x="28" y="148" dominant-baseline="central">once per camera and</text>
<text class="ts" x="28" y="164" dominant-baseline="central">frame, read by search,</text>
<text class="ts" x="28" y="180" dominant-baseline="central">fire and the next steps</text>
<rect class="box" x="210" y="126" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Line up with background</text>
<text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">wind shake cancelled</text>
<line x1="340" y1="182" x2="340" y2="210" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="210" y="212" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="230" text-anchor="middle" dominant-baseline="central">Compare with background</text>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">swaying leaves already learned</text>
<line x1="340" y1="268" x2="340" y2="296" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="210" y="298" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="316" text-anchor="middle" dominant-baseline="central">Most of the frame changed?</text>
<text class="ts" x="340" y="336" text-anchor="middle" dominant-baseline="central">clouds, lamps</text>
<text class="ts" x="484" y="316" text-anchor="middle">yes</text>
<line x1="470" y1="326" x2="498" y2="326" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="500" y="298" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="316" text-anchor="middle" dominant-baseline="central">Light change</text>
<text class="ts" x="570" y="336" text-anchor="middle" dominant-baseline="central">skip it</text></g>
<text class="ts" x="356" y="373">no</text>
<line x1="340" y1="354" x2="340" y2="382" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="210" y="384" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="402" text-anchor="middle" dominant-baseline="central">Covered by a tracked object?</text>
<text class="ts" x="340" y="422" text-anchor="middle" dominant-baseline="central">person, car, dog</text>
<text class="ts" x="484" y="402" text-anchor="middle">yes</text>
<line x1="470" y1="412" x2="498" y2="412" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="500" y="384" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="402" text-anchor="middle" dominant-baseline="central">Already indexed</text>
<text class="ts" x="570" y="422" text-anchor="middle" dominant-baseline="central">by the detector</text></g>
<path d="M340 440 L340 455 L235 455 L235 468" class="arr" marker-end="url(#arrow)"/>
<path d="M340 455 L445 455 L445 468" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="150" y="470" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="235" y="488" text-anchor="middle" dominant-baseline="central">Moving thing</text>
<text class="ts" x="235" y="508" text-anchor="middle" dominant-baseline="central">index it now</text></g>
<g class="c-amber"><rect x="360" y="470" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="445" y="488" text-anchor="middle" dominant-baseline="central">New and still</text>
<text class="ts" x="445" y="508" text-anchor="middle" dominant-baseline="central">index it once</text></g>
</svg>
