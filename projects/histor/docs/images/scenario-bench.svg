<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img" aria-label="The scenario bench: clips (FIRESENSE fire and smoke videos, street cases composed over a real video, night looks) and a sheet of expected events go through the Pipeline; the alerts are scored for recall, misses, false alarms and delay; compared with the saved baseline, a regression fails.">
<style>
:root { --t: #888780; }
text { font-family: system-ui, "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tx { font-size: 10px; fill: #5F5E5A; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 9px; fill: #444441; }
.box { fill: #FAF9F5; stroke: #B4B2A9; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-amber > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.flame { fill: #D85A30; } .flame-core { fill: #FAEEDA; }
</style>
<rect width="680" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- clips -->
<text class="th" x="30" y="28">Clips</text>

<!-- FIRESENSE: four small video frames, fire and smoke, positive and negative -->
<g transform="translate(30,40)">
<rect class="box" width="196" height="80" rx="6" stroke-width="0.5"/>
<text class="ts" x="10" y="17">FIRESENSE videos</text>
<g transform="translate(10,26)"><rect width="40" height="30" rx="2" fill="#2C2C2A"/><path class="flame" d="M20 26 C10 24 11 15 16 10 C16 15 19 15 19 12 C21 15 27 16 26 21 C26 24 23 26 20 26Z"/><path class="flame-core" d="M20 25 C17 24 17 20 19 18 C20 20 21 20 21 19 C23 21 23 24 20 25Z"/></g>
<g transform="translate(55,26)"><rect width="40" height="30" rx="2" fill="#5F5E5A"/><circle cx="16" cy="18" r="6" fill="#B4B2A9" opacity="0.8"/><circle cx="22" cy="12" r="7" fill="#B4B2A9" opacity="0.7"/><circle cx="28" cy="7" r="5" fill="#B4B2A9" opacity="0.6"/></g>
<g transform="translate(100,26)"><rect width="40" height="30" rx="2" fill="#E5E3DC"/><circle cx="31" cy="9" r="5" fill="#BA7517"/><line x1="0" y1="22" x2="40" y2="22" stroke="#888780"/></g>
<g transform="translate(145,26)"><rect width="40" height="30" rx="2" fill="#5F5E5A"/><circle cx="14" cy="13" r="4" fill="#FAEEDA"/><circle cx="27" cy="13" r="4" fill="#FAEEDA"/></g>
<text class="tx" x="30" y="70" text-anchor="middle">fire</text><text class="tx" x="75" y="70" text-anchor="middle">smoke</text>
<text class="tx" x="120" y="70" text-anchor="middle">no fire</text><text class="tx" x="165" y="70" text-anchor="middle">no smoke</text>
</g>

<!-- street composed over vtest.avi: a little street with a person and a dropped box -->
<g transform="translate(30,130)">
<rect class="box" width="196" height="96" rx="6" stroke-width="0.5"/>
<text class="ts" x="10" y="17">Street cases, drawn over a real video</text>
<g transform="translate(10,26)">
<rect width="176" height="58" rx="2" fill="#F1EFE8"/>
<rect x="6" y="6" width="44" height="22" fill="#E5E3DC" stroke="#B4B2A9" stroke-width="0.5"/><rect x="58" y="2" width="56" height="26" fill="#E5E3DC" stroke="#B4B2A9" stroke-width="0.5"/>
<g fill="#B4B2A9"><rect x="12" y="11" width="8" height="6"/><rect x="26" y="11" width="8" height="6"/><rect x="66" y="8" width="8" height="6"/><rect x="82" y="8" width="8" height="6"/><rect x="98" y="8" width="8" height="6"/></g>
<rect x="0" y="34" width="176" height="14" fill="#E5E3DC"/><line x1="0" y1="41" x2="176" y2="41" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 5"/>
<g stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" fill="none"><circle cx="128" cy="24" r="3.5"/><line x1="128" y1="28" x2="128" y2="40"/><line x1="128" y1="40" x2="124" y2="49"/><line x1="128" y1="40" x2="132" y2="49"/><line x1="128" y1="31" x2="135" y2="36"/></g>
<g transform="translate(140,40)"><rect width="16" height="12" fill="#BA7517" stroke="#854F0B" stroke-width="0.6"/><rect y="0" width="16" height="3" fill="#FAEEDA" opacity="0.6"/><line x1="8" y1="0" x2="8" y2="12" stroke="#FAEEDA" stroke-width="1.5"/></g>
<rect x="24" y="36" width="40" height="18" rx="2" fill="#534AB7"/><rect x="28" y="40" width="9" height="5" fill="#EEEDFE"/><circle cx="32" cy="55" r="3" fill="#2C2C2A"/><circle cx="56" cy="55" r="3" fill="#2C2C2A"/>
</g>
<text class="tx" x="10" y="92">cover, van, turned, cart, red coat, lamp, fall</text>
</g>

<!-- fire test videos -->
<g transform="translate(30,236)">
<rect class="box" width="196" height="64" rx="6" stroke-width="0.5"/>
<text class="ts" x="10" y="17">Fire test videos</text>
<g transform="translate(10,24)"><rect width="40" height="30" rx="2" fill="#444441"/><path class="flame" d="M20 27 C9 25 10 15 15 9 C15 15 19 15 19 11 C22 15 28 16 27 22 C27 25 24 27 20 27Z"/><path d="M8 8 q3 -4 6 0 M26 6 q3 -4 6 0" stroke="#FAEEDA" stroke-width="1" fill="none"/></g>
<text class="tx" x="56" y="34">flickering</text><text class="tx" x="56" y="47">fire, smoke</text>
<g transform="translate(124,24)"><rect width="30" height="30" rx="1" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/><path class="flame" d="M15 25 C7 23 8 15 11 11 C12 15 14 15 14 12 C16 15 21 16 20 20 C20 23 18 25 15 25Z"/></g>
<text class="tx" x="160" y="34">still</text><text class="tx" x="160" y="47">poster</text>
</g>

<!-- night looks -->
<g transform="translate(30,310)">
<rect class="box" width="196" height="72" rx="6" stroke-width="0.5"/>
<text class="ts" x="10" y="17">Night looks of every clip</text>
<g transform="translate(10,24)"><rect width="40" height="28" rx="2" fill="#FAEEDA"/><path class="flame" d="M20 24 C13 23 14 16 17 12 C17 16 20 16 20 13 C22 16 26 17 25 20 C25 22 23 24 20 24Z"/></g>
<g transform="translate(55,24)"><rect width="40" height="28" rx="2" fill="#E5E3DC"/><path d="M20 24 C13 23 14 16 17 12 C17 16 20 16 20 13 C22 16 26 17 25 20 C25 22 23 24 20 24Z" fill="#888780"/></g>
<g transform="translate(100,24)"><rect width="40" height="28" rx="2" fill="#444441"/><path d="M20 24 C13 23 14 16 17 12 C17 16 20 16 20 13 C22 16 26 17 25 20 C25 22 23 24 20 24Z" fill="#712B13"/></g>
<g transform="translate(145,24)"><rect width="40" height="28" rx="2" fill="#5F5E5A"/><circle cx="20" cy="18" r="9" fill="#B4B2A9" opacity="0.6"/><path d="M20 24 C13 23 14 16 17 12 C17 16 20 16 20 13 C22 16 26 17 25 20 C25 22 23 24 20 24Z" fill="#ffffff"/></g>
<text class="tx" x="30" y="64" text-anchor="middle">colour</text><text class="tx" x="75" y="64" text-anchor="middle">grey</text>
<text class="tx" x="120" y="64" text-anchor="middle">low light</text><text class="tx" x="165" y="64" text-anchor="middle">infrared</text>
</g>

<!-- arrows into the Pipeline -->
<path d="M226 80 C238 80 240 250 250 250" class="arr"/>
<path d="M226 178 C238 178 240 250 250 250" class="arr"/>
<path d="M226 268 C238 268 240 250 250 250" class="arr"/>
<path d="M226 346 C238 346 240 250 248 250" class="arr" marker-end="url(#arrow)"/>

<!-- expected events sheet -->
<text class="th" x="252" y="28">What should happen</text>
<g transform="translate(252,40)">
<path d="M0 4 a4 4 0 0 1 4 -4 H150 L172 22 V156 a4 4 0 0 1 -4 4 H4 a4 4 0 0 1 -4 -4 Z" fill="#FAF9F5" stroke="#B4B2A9" stroke-width="0.5"/>
<path d="M150 0 V22 H172" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="10" y="17">street_cover.json</text>
<text class="code" x="10" y="42">"layers": [{</text>
<text class="code" x="10" y="55">  "kind": "cover", "from": 40}],</text>
<text class="code" x="10" y="76">"expect": [{</text>
<text class="code" x="10" y="89">  "type": "tamper",</text>
<text class="code" x="10" y="102">  "rule": "blocked",</text>
<text class="code" x="10" y="115">  "from": 40, "max_delay": 15}]</text>
<text class="tx" x="10" y="132">fire_loop: fire from 9 s, smoke</text>
<text class="tx" x="10" y="146">from 24 s, each within 3 s</text>
</g>

<!-- Pipeline -->
<g class="c-teal"><rect x="252" y="222" width="160" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="332" y="242" text-anchor="middle" dominant-baseline="central">Pipeline</text>
<text class="ts" x="332" y="262" text-anchor="middle" dominant-baseline="central">detect · track · tamper · fire</text></g>
<line x1="332" y1="200" x2="332" y2="220" class="arr" marker-end="url(#arrow)"/>
<text class="tx" x="332" y="298" text-anchor="middle">the fire suite like a live camera:</text>
<text class="tx" x="332" y="311" text-anchor="middle">frames dropped while the CPU is busy</text>
<g class="c-gray"><rect x="272" y="326" width="120" height="34" rx="6" stroke-width="0.5"/>
<text class="ts" x="332" y="343" text-anchor="middle" dominant-baseline="central">alert log</text></g>
<line x1="332" y1="280" x2="332" y2="290" class="arr"/>
<line x1="332" y1="314" x2="332" y2="324" class="arr" marker-end="url(#arrow)"/>
<path d="M392 343 C420 343 420 140 446 140" class="arr" marker-end="url(#arrow)"/>

<!-- score card -->
<text class="th" x="448" y="28">Score</text>
<g transform="translate(448,40)">
<rect width="202" height="196" rx="6" fill="#FAF9F5" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="12" y="20">fire suite, colour</text>
<text class="ts" x="12" y="48">recall</text><text class="th" x="190" y="48" text-anchor="end">80%</text>
<text class="ts" x="12" y="74">early, within 3 s</text><text class="th" x="190" y="74" text-anchor="end">3 of 4</text>
<text class="ts" x="12" y="100">missed</text><text class="th" x="190" y="100" text-anchor="end" fill="#993C1D">1</text>
<text class="ts" x="12" y="126">false alarms</text><text class="th" x="190" y="126" text-anchor="end">1</text>
<text class="ts" x="12" y="152">delay, median</text><text class="th" x="190" y="152" text-anchor="end">0.8 s</text>
<text class="tx" x="12" y="180">missed: smoke on a far camera (4x)</text>
</g>

<!-- baseline and the regression gate -->
<g transform="translate(448,262)">
<path d="M0 4 a4 4 0 0 1 4 -4 H92 L110 18 V86 a4 4 0 0 1 -4 4 H4 a4 4 0 0 1 -4 -4 Z" fill="#FAF9F5" stroke="#B4B2A9" stroke-width="0.5"/>
<path d="M92 0 V18 H110" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="10" y="17">baseline</text>
<text class="tx" x="10" y="38">fire.json</text>
<text class="tx" x="10" y="52">street.json</text>
<text class="tx" x="10" y="66">pose.json</text>
<text class="tx" x="10" y="80">(tracked in git)</text>
</g>
<line x1="549" y1="238" x2="549" y2="258" class="arr" marker-end="url(#arrow)"/>
<text class="tx" x="556" y="252">--compare</text>
<g transform="translate(568,286)">
<rect width="82" height="40" rx="6" fill="#993C1D"/>
<text x="41" y="16" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff">regression</text>
<text x="41" y="31" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff">FAIL, exit 1</text>
</g>
<text class="tx" x="568" y="342">a hit now missed,</text>
<text class="tx" x="568" y="355">fire 1 s later,</text>
<text class="tx" x="568" y="368">a new false alarm</text>

<text class="tx" x="30" y="412">Measured 2026-10-20 on this laptop: fire_loop, its poster and its far view, each in 4 looks; 8 street cases; a fall.</text>
<text class="tx" x="30" y="428">FIRESENSE (Dimitropoulos et al., Zenodo 836749, CC BY 4.0) joins once downloaded.</text>
</svg>
