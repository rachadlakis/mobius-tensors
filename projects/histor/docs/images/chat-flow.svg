<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="330" fill="#ffffff"/><defs><marker id="a5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ab8862b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8862b"/></marker><marker id="ac05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs><rect x="20" y="110" width="150" height="80" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="95.0" y="130.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Question</text><text x="95.0" y="147.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">&quot;did anyone fall in</text><text x="95.0" y="162.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">the warehouse</text><text x="95.0" y="177.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">last night?&quot;</text><rect x="210" y="100" width="170" height="100" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="295.0" y="130.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Chat model</text><text x="295.0" y="147.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">Qwen3 4B local (default),</text><text x="295.0" y="162.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">or any OpenAI-compatible</text><text x="295.0" y="177.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">server, or Claude</text><path d="M170,150.0 L208,150.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="12" width="230" height="44" rx="8" fill="#fff" stroke="#d9dee5"/><text x="565.0" y="30.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">objects</text><text x="565.0" y="47.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">what, when, how many — exact</text><path d="M380,150 H415 V34 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="61" width="230" height="44" rx="8" fill="#fff" stroke="#d9dee5"/><text x="565.0" y="79.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">search</text><text x="565.0" y="96.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">CLIP by description — ranked</text><path d="M380,150 H415 V83 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="110" width="230" height="44" rx="8" fill="#fff" stroke="#d9dee5"/><text x="565.0" y="128.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">people</text><text x="565.0" y="145.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">pose facts, colours — exact</text><path d="M380,150 H415 V132 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="159" width="230" height="44" rx="8" fill="#fff" stroke="#d9dee5"/><text x="565.0" y="177.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">alerts</text><text x="565.0" y="194.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">events + verdicts — exact</text><path d="M380,150 H415 V181 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="208" width="230" height="44" rx="8" fill="#fff" stroke="#d9dee5"/><text x="565.0" y="226.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">plates · face</text><text x="565.0" y="243.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">plate text · photo (opt-in)</text><path d="M380,150 H415 V230 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="450" y="257" width="230" height="44" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="565.0" y="275.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2430">look</text><text x="565.0" y="292.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">local vision model reads images</text><path d="M380,150 H415 V279 H448" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="720" y="95" width="120" height="110" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="780.0" y="130.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Site store</text><text x="780.0" y="147.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">events, sightings,</text><text x="780.0" y="162.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">poses, plates,</text><text x="780.0" y="177.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">faces</text><path d="M680,150 H718" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="860" y="95" width="120" height="110" rx="8" fill="#eef7f1" stroke="#2f855a"/><text x="920.0" y="122.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Answer</text><text x="920.0" y="139.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">in sentences,</text><text x="920.0" y="154.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">with the</text><text x="920.0" y="169.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">thumbnails</text><text x="920.0" y="184.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">as evidence</text><path d="M840,150 H858" stroke="#5b6675" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a5b6675)"/><text x="500" y="318" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">Up to six rounds of lookups per question. With Claude, only text goes out (times, cameras, labels, file names): never images or video; `look` runs on the site.</text></svg>