<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="300" fill="#ffffff"/><defs><marker id="a5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ab8862b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8862b"/></marker><marker id="ac05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs><text x="20" y="26" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">EVERY FRAME OF THE SUB STREAM (AS FAST AS THE CPU ALLOWS; STALE FRAMES ARE DROPPED)</text><rect x="20" y="45" width="130" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="85.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Frame</text><text x="85.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">sub stream,</text><text x="85.0" y="103.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">e.g. 704 × 576</text><rect x="180" y="45" width="140" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="250.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Letterbox</text><text x="250.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">scaled to fit 640 × 640,</text><text x="250.0" y="103.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">grey padding</text><rect x="350" y="45" width="140" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="420.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">YOLOX-S (ONNX)</text><text x="420.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">8,400 candidate boxes,</text><text x="420.0" y="103.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">80 class scores each</text><rect x="520" y="45" width="140" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="590.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Filter + NMS</text><text x="590.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">score ≥ 0.35 (0.25 with</text><text x="590.0" y="103.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">zones); overlaps merged</text><rect x="690" y="45" width="140" height="76" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="760.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Detections</text><text x="760.0" y="88.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">box, label, score,</text><text x="760.0" y="103.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">in frame pixels</text><path d="M150,83.0 L178,83.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M320,83.0 L348,83.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M490,83.0 L518,83.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M660,83.0 L688,83.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><text x="135" y="168" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">TRACKER: THE SAME OBJECT GETS THE SAME #ID FROM FRAME TO FRAME</text><rect x="20" y="178" width="190" height="100" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="115.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Match</text><text x="115.0" y="225.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">each detection to the track</text><text x="115.0" y="240.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">it overlaps most (IoU ≥ 0.3);</text><text x="115.0" y="255.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">weak detections only extend</text><rect x="240" y="178" width="190" height="100" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="335.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Confirm</text><text x="335.0" y="225.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">a new track needs 3 hits</text><text x="335.0" y="240.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">before it gets an #id</text><text x="335.0" y="255.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">(no flicker objects)</text><rect x="460" y="178" width="190" height="100" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="555.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Coast</text><text x="555.0" y="225.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">a hidden object keeps its</text><text x="555.0" y="240.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">#id for 30 frames</text><text x="555.0" y="255.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">(people walking past)</text><rect x="680" y="178" width="150" height="100" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="755.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Label vote</text><text x="755.0" y="233.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">car / truck flicker</text><text x="755.0" y="248.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">smoothed over the track</text><rect x="860" y="178" width="120" height="100" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="920.0" y="208.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Tracks</text><text x="920.0" y="225.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">→ rules, CLIP,</text><text x="920.0" y="240.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">pose, faces,</text><text x="920.0" y="255.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">plates</text><path d="M760.0,121 V145 H115 V176" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M210,228.0 L238,228.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M430,228.0 L458,228.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M650,228.0 L678,228.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M830,228.0 L858,228.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/></svg>