t" font-size="11" font-weight="400" fill="#1b2430">person's left side</text><rect x="380" y="310" width="22" height="5" rx="2" fill="#d0731c"/><text x="410" y="316" text-anchor="start" font-size="11" font-weight="400" fill="#1b2430">person's right side</text><rect x="380" y="330" width="22" height="5" rx="2" fill="#7a8492"/><text x="410" y="336" text-anchor="start" font-size="11" font-weight="400" fill="#1b2430">nose, and links across the body</text><text x="380" y="382" text-anchor="start" font-size="11" font-weight="400" fill="#5b6675">Each keypoint comes with a confidence (0–1). Below 0.3 it counts</text><text x="380" y="398" text-anchor="start" font-size="11" font-weight="400" fill="#5b6675">as not visible, and the facts that need it become "unknown".</text><text x="380" y="422" text-anchor="start" font-size="11" font-weight="400" fill="#5b6675">Stored per row: 17 × (x, y, confidence) as float16, relative to</text><text x="380" y="438" text-anchor="start" font-size="11" font-weight="400" fill="#5b6675">the person box (102 bytes), so new facts can be derived later</text><text x="380" y="454" text-anchor="start" font-size="11" font-weight="400" fill="#5b6675">without running the model again.</text><text x="820" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#b8862b">COLOUR AREAS</text><ellipse cx="820.0" cy="122.7" rx="22.8" ry="28.5" fill="none" stroke="#d9dee5" stroke-width="2"/><line x1="852.3" y1="159.8" x2="787.7" y2="159.8" stroke="#7a8492" stroke-width="2" stroke-linecap="round"/><line x1="852.3" y1="159.8" x2="861.8" y2="207.2" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round"/><line x1="861.8" y1="207.2" x2="865.6" y2="250.0" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round"/><line x1="787.7" y1="159.8" x2="778.2" y2="207.2" stroke="#d0731c" stroke-width="2" stroke-linecap="round"/><line x1="778.2" y1="207.2" x2="774.4" y2="250.0" stroke="#d0731c" stroke-width="2" stroke-linecap="round"/><line x1="852.3" y1="159.8" x2="83