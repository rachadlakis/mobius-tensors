<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="330" fill="#ffffff"/><defs><marker id="a5b6675" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ab8862b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8862b"/></marker><marker id="ac05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs><text x="20" y="26" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">WHILE RECORDING (OWN THREAD: SKIPS SAMPLES RATHER THAN SLOWING DETECTION)</text><rect x="20" y="42" width="170" height="82" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="105.0" y="63.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Object crops</text><text x="105.0" y="80.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">each track when it appears,</text><text x="105.0" y="95.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">then every 2 s (≥ 40 px tall);</text><text x="105.0" y="110.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">hi-res from the main stream</text><rect x="20" y="134" width="170" height="66" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="105.0" y="155.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Scene + 2×2 tiles</text><text x="105.0" y="172.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">every 5 s: things the</text><text x="105.0" y="187.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">detector has no class for</text><rect x="230" y="80" width="160" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="310.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">CLIP image encoder</text><text x="310.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">ViT-B/32 LAION-2B,</text><text x="310.0" y="138.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">224 × 224, ~30 ms</text><rect x="430" y="80" width="150" height="76" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="505.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">512 numbers</text><text x="505.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">length 1: a point on</text><text x="505.0" y="138.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">a sphere of meaning</text><rect x="620" y="80" width="170" height="76" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="705.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">sightings table</text><text x="705.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">vector, camera, time, track,</text><text x="705.0" y="138.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">box, thumbnail, model</text><path d="M190,83.0 H210.0 V118.0 H228" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M190,167.0 H210.0 V118.0 H228" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M390,118.0 L428,118.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M580,118.0 L618,118.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><text x="20" y="232" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">AT QUESTION TIME (NO LLM NEEDED)</text><rect x="20" y="245" width="170" height="70" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="105.0" y="276.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">&quot;white van at the gate</text><text x="105.0" y="293.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">yesterday 6pm to 9pm&quot;</text><rect x="230" y="245" width="160" height="70" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="310.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">query.py</text><text x="310.0" y="285.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">what / when / camera,</text><text x="310.0" y="300.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">by rules</text><rect x="430" y="245" width="150" height="70" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="505.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">CLIP text encoder</text><text x="505.0" y="285.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">&quot;white van&quot; + 2 phrasings,</text><text x="505.0" y="300.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">averaged → 512 numbers</text><rect x="620" y="245" width="170" height="70" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="705.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Cosine similarity</text><text x="705.0" y="285.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">with every stored vector of</text><text x="705.0" y="300.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">the same model, in range</text><rect x="830" y="245" width="150" height="70" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="905.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Visits</text><text x="905.0" y="285.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">matches of one track</text><text x="905.0" y="300.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">merged, best first</text><path d="M190,280.0 L228,280.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M390,280.0 L428,280.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M580,280.0 L618,280.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M790,280.0 L828,280.0" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M705.0,156 V243" stroke="#b8862b" stroke-width="1.5" fill="none" marker-end="url(#ab8862b)"/><text x="705" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">brute force, numpy:</text><text x="705" y="214" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">millions of rows a second</text></svg>