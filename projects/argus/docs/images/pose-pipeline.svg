<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 252" width="910" height="252" font-family="Segoe UI, Arial, sans-serif"><rect width="910" height="252" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs><text x="20" y="30" text-anchor="start" font-size="11" font-weight="700" fill="#b8862b">PER PERSON, ABOUT ONCE A SECOND (3× LESS WHILE STANDING STILL), ON ITS OWN THREAD</text><rect x="20" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="85" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Tracked person</text><text x="85" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">box from YOLOX + tracker,</text><text x="85" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">≥ 80 px tall</text><rect x="168" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="233" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Padded crop</text><text x="233" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">box × 1.25, warped</text><text x="233" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">to 192 × 256 px</text><path d="M152,80 H166" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="316" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="381" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">ViTPose-B</text><text x="381" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">17 heatmaps (64 × 48),</text><text x="381" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">peak = keypoint</text><path d="M300,80 H314" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="464" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="529" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Facts (rules)</text><text x="529" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">posture, arms, facing,</text><text x="529" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">top / trousers colour</text><path d="M448,80 H462" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="44" width="130" height="72" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="677" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Smoothing</text><text x="677" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">majority of the</text><text x="677" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">last 3 samples</text><path d="M596,80 H610" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="44" width="130" height="72" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="825" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Row on change</text><text x="825" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">or every 10 s; keypoints</text><text x="825" y="99" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">kept (102 bytes)</text><path d="M744,80 H758" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M677,118 V142 H170 V168" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M825,118 V168" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M618,203 H592" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="40" y="170" width="260" height="66" rx="8" fill="#fff" stroke="#d9dee5"/><text x="170" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">Events: down, hands_up</text><text x="170" y="210" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">lying ≥ 10 s / both hands up ≥ 3 s</text><text x="170" y="225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">→ alert channels, alerts tool</text><rect x="330" y="170" width="260" height="66" rx="8" fill="#fff" stroke="#d9dee5"/><text x="460" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">people tool / GET /people</text><text x="460" y="210" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">"anyone lying last night?"</text><text x="460" y="225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">"red top, blue jeans?"</text><rect x="620" y="170" width="260" height="66" rx="8" fill="#fff" stroke="#d9dee5"/><text x="750" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2430">poses table (SQLite)</text><text x="750" y="210" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">facts + time per person,</text><text x="750" y="225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">seconds in each posture</text></svg>