" y="160.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">type, rule, label,</text><text x="285.0" y="175.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">track, time</text><path d="M180,63.0 H200.0 V155.0 H218" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M180,121.0 H200.0 V155.0 H218" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M180,179.0 H200.0 V155.0 H218" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M180,237.0 H200.0 V155.0 H218" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="390" y="40" width="160" height="70" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="470.0" y="63.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Stored at once</text><text x="470.0" y="80.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">event row + snapshot</text><text x="470.0" y="95.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">(the chat sees all)</text><path d="M350,155.0 H370 V75 H388" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="390" y="165" width="160" height="90" rx="8" fill="#fbf6ec" stroke="#b8862b"/><text x="470.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Check? (opt-in)</text><text x="470.0" y="207.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">vision model gets the</text><text x="470.0" y="222.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">snapshot + close-up:</text><text x="470.0" y="237.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">YES / NO / UNSURE</text><path d="M350,155.0 H370 V210 H388" stroke="#b8862b" stroke-width="1.5" fill="none" marker-end="url(#ab8862b)"/><rect x="600" y="120" width="170" height="56" rx="8" fill="#eef7f1" stroke="#2f855a"/><text x="685.0" y="144.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">YES · UNSURE</text><text x="685.0" y="161.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">sent, with the verdict</text><rect x="600" y="186" width="170" height="56" rx="8" fill="#fdf0ea" stroke="#c05621"/><text x="685.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">NO</text><text x="685.0" y="219.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">held back (veto mode);</text><text x="685.0" y="234.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">stored as verified: no</text><rect x="600" y="252" width="170" height="56" rx="8" fill="#f4f6f9" stroke="#d9dee5"/><text x="685.0" y="276.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Error · too slow · busy</text><text x="685.0" y="293.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">sent unverified</text><path d="M550,210.0 H575 V148.0 H598" stroke="#2f855a" stroke-width="1.5" fill="none" marker-end="url(#a2f855a)"/><path d="M550,210.0 H575 V214.0 H598" stroke="#c05621" stroke-width="1.5" fill="none" marker-end="url(#ac05621)"/><path d="M550,210.0 H575 V280.0 H598" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><rect x="810" y="92" width="170" height="130" rx="8" fill="#fff" stroke="#d9dee5"/><text x="895.0" y="121.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">Channels</text><text x="895.0" y="138.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">each with its filter:</text><text x="895.0" y="153.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">rules, events, labels,</text><text x="895.0" y="168.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">hours, cooldown</text><text x="895.0" y="183.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">webhook · email</text><text x="895.0" y="198.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b6675">(Telegram, SMS… next)</text><path d="M770,148.0 H785 V150 H808" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M770,280.0 H795 V180 H808" stroke="#5b6675" stroke-width="1.5" fill="none" marker-end="url(#a5b6675)"/><path d="M285.0,190 V335 H895 V222" stroke="#5b6675" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a5b6675)"/><text x="560" y="330" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6675">not checked (check off, type not listed, no question for it, or no image): sent as before</text></svg>