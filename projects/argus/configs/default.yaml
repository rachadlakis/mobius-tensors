# Argus: record everything the camera sees, ask about it later.
# Models are shared with ../object-detection (download them there once, see README).
#
#   uv run src/record.py --source gate                  # one recorder per camera
#   uv run src/record.py --source ../object-detection/data/vtest.avi --camera street --start-time 2026-09-25T14:00
#   uv run src/ask.py "person with an umbrella yesterday"

source: 0  # webcam index, image/video path, rtsp/http URL, or a camera name below

model:
  backend: yolox_onnx
  path: ../object-detection/models/yolox_nano.onnx
  conf_threshold: 0.25
  nms_threshold: 0.45
  class_agnostic_nms: true
  classes: null              # null = every class the model knows
  device: auto               # GPU if there is one, else CPU (also `device:` under search.clip, pose)

tracking:
  track_threshold: 0.45
  max_missed: 30
  min_hits: 3

# Same format as ../object-detection/configs/default.yaml; passwords as ${VAR} in .env.
# `about:` is filled in at install time, standing at the camera: the chat reads it to pick the
# right camera ("did anyone reach the office") and to explain its answers. Roles, not names.
cameras: {}
#  office:
#    vendor: hikvision
#    host: 192.168.1.64
#    username: admin
#    password: ${OFFICE_CAM_PASSWORD}
#    stream: sub
#    about:
#      description: Inside the manager's office, above the door, looking at the desk
#      aliases: [manager's office, office 2]   # other names people use (also in ask.py)
#      location: Ground floor, end of the corridor, past reception
#      covers: entrance        # entrance | exit | passage | room | outdoor | parking
#      faces: good             # good | poor | none: is a face big and frontal enough here?
#      hours: "08:00-18:00"    # normal activity; outside it is "after hours"
#      notes: Staff only. Cleaners come in around 19:00.
#      zones:                  # what the alert areas / lines on this camera mean
#        door: The office door; entering it means entering the office

store:
  path: data/store/argus.db   # SQLite, shared by all recorders of a site and by ask.py
  media_dir: data/store/media
  retention_days: 30
  face_retention_days: 7

# Main stream of each live camera (needs ffmpeg >= 5.1: sudo apt install ffmpeg).
# The detector keeps reading the cheap sub stream; this opens the full-resolution one too.
# Set the camera's main-stream I-frame interval to 1 s (= its FPS): one keyframe per second.
recording:
  enabled: true                # save the main stream untouched (-c copy, ~no CPU), 1 file/minute
  dir: data/store/recordings
  segment_seconds: 60
  retention_days: 7            # 1080p at 4 Mbit/s = ~43 GB per camera per day
  min_free_gb: 20              # also delete the oldest files when the disk gets this full
  hires_crops: true            # crop search/face images from main-stream keyframes (+1 detection/s)

search:
  enabled: true
  clip:
    image: ../object-detection/models/clip_image.onnx
    text: ../object-detection/models/clip_text.onnx
    vocab: ../object-detection/models/clip_bpe_vocab.txt.gz
  # Every COCO class gets embedded, not only people and vehicles.
  classes: [
    person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
    fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow,
    elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee,
    skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard,
    tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana, apple,
    sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
    potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard,
    cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors,
    teddy bear, hair drier, toothbrush,
  ]
  object_interval_seconds: 2   # re-embed each tracked object at most this often
  scene_interval_seconds: 5    # whole frame + tiles: catches what the detector has no class for
  scene_tiles: 2
  min_box_height: 40           # smaller crops carry too few pixels for CLIP to describe

# Alerts: rules evaluated live on every tracked object, next to the memory. Off until a rule is
# listed. Draw areas/lines in object-detection's UI (Zones & lines tab) and paste them here.
# Points are 0..1 of the frame; a zone without points is the whole picture ("seen anywhere").
# Every alert is stored (with a snapshot) and the chat can answer about it ("any alerts last night?").
zones: []
#  - name: yard                 # someone in the yard: enter / exit, and stays > 60 s
#    type: zone
#    points: [[0.10, 0.55], [0.60, 0.50], [0.65, 0.95], [0.05, 0.95]]
#    classes: [person]
#    dwell_seconds: 60
#  - name: gate_line            # vehicles crossing the gate, inbound only
#    type: line
#    points: [[0.40, 0.30], [0.40, 0.80]]
#    classes: [car, truck, bus, motorcycle]
#    direction: in
#  - name: anywhere_dog         # no points: anywhere in the picture
#    classes: [dog]

alerts:
  console: true
  events: null                 # e.g. [enter, dwell] to alert on only some event types
  cooldown_seconds: 0          # 0: store every event (the chat needs them all); hold back
                               # repeated messages with a cooldown per channel instead
  snapshots: true
  # Where alerts are sent. Each channel can filter: rules, events, labels, hours ("22:00-06:00")
  # and cooldown_seconds (at most one message per rule + event type in that time).
  # More channels (Telegram, WhatsApp, SMS, siren) plug in the same way: see the README.
  channels: []
  #  - type: webhook            # JSON POST: n8n, Zapier, Make, Slack/Teams workflows, your backend
  #    url: ${ALERT_WEBHOOK_URL}
  #    cooldown_seconds: 30
  #  - type: email
  #    host: smtp.example.com
  #    sender: alerts@example.com
  #    to: [security@example.com]
  #    username: ${SMTP_USER}
  #    password: ${SMTP_PASSWORD}
  #    labels: [person]
  #    hours: "22:00-06:00"     # only people, only at night

# Periodic reports (src/report.py, keep it running next to the recorders): at the end of each
# period, exact counts from the store plus a summary written by the chat model, focused on what
# the owner asked to watch. Saved under data/store/reports/<name>/ (UI Reports tab, --show) and
# sent to the report's channels. Set up at install time, with the owner.
reports: []
#  - name: morning
#    every: daily               # hourly | daily | weekly
#    at: "07:00"                # daily / weekly: the period ends (and the report goes out) then
#    # day: monday              # weekly only
#    cameras: [gate, yard]      # names or aliases; empty = every camera
#    interests:                 # in the owner's words; empty = what happened + anything unusual
#      - vehicles at the gate after hours
#      - anyone in the yard at night
#      - parcels left by the door
#    # model: local             # chat.models entry (default: chat.model)
#    # words: 200               # length of the written summary
#    channels:                  # same settings as alerts.channels; none = saved only
#      - type: email
#        host: smtp.example.com
#        sender: argus@example.com
#        to: [owner@example.com]
#        username: ${SMTP_USER}
#        password: ${SMTP_PASSWORD}
#  - name: weekly_overview
#    every: weekly
#    day: monday
#    at: "08:00"

# Chat (src/chat.py): which LLM answers questions. Switch with --model <name> or /model <name>.
chat:
  model: local
  models:
    local:                     # runs on the site's server, footage never leaves it
      api: openai              # any OpenAI-compatible server: Ollama, llama.cpp, LM Studio, vLLM
      base_url: http://127.0.0.1:11434/v1   # Ollama; llama.cpp server: http://127.0.0.1:8080/v1
      model: qwen3:4b          # Apache-2.0, good tool calling on CPU; `ollama pull qwen3:4b`
      temperature: 0.2
      note: Qwen3 4B · Apache-2.0 · 2.5 GB · CPU
    # Newer open models to compare on the same questions (licences checked 2026-10-08,
    # see docs/argus "Argus — Documentation", Part 3). `note` is only shown in the UI.
    qwen3.5-4b:                # successor of qwen3:4b, also reads images (for a future `look` tool)
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: qwen3.5:4b
      temperature: 0.2
      note: Qwen3.5 4B · Apache-2.0 · 3.4 GB · CPU · tools + vision
    granite-3b:                # smallest: for weak servers
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: granite4.1:3b
      temperature: 0.2
      note: IBM Granite 4.1 3B · Apache-2.0 · 2.1 GB · CPU · tuned for tool use
    gemma4-e4b:
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: gemma4:e4b
      temperature: 0.2
      note: Gemma 4 E4B · Apache-2.0 · 6.6 GB · CPU · tools + vision
    local-large:               # better answers, needs ~20 GB RAM or a GPU
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: qwen3:30b-a3b
      note: Qwen3 30B-A3B · Apache-2.0 · 19 GB · 32 GB RAM or GPU
    qwen3.6-large:             # newer large option, 3B active: still usable on a strong CPU
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: qwen3.6:35b
      note: Qwen3.6 35B-A3B · Apache-2.0 · 24 GB · 32 GB RAM or GPU · tools + vision
    nemotron-large:            # Mamba-MoE, 3B active, long context; licence: read OpenMDW 1.1 first
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: nemotron-3.5-lightning
      note: NVIDIA Nemotron 3.5 Lightning 30B-A3B · OpenMDW 1.1 · 25 GB · 32 GB RAM or GPU
    claude:                    # cloud: only search results (text) are sent, never video
      api: anthropic           # uv sync --group claude; key from ANTHROPIC_API_KEY in .env
      model: claude-opus-5-5
      effort: low              # low | medium | high: chat questions rarely need more
      note: Claude Opus 5.5 · Anthropic API (cloud)

# Face prints are biometric data: off unless a client has approved it (see object-detection README).
# When on, the chat can look for a person from a photo: /photo visitor.jpg, then ask.
faces:
  enabled: false
  cameras: []                  # empty = every camera; better: only those with `about.faces: good`
  detector: ../object-detection/models/face_detection_yunet_2023mar.onnx
  recognizer: ../object-detection/models/face_recognition_sface_2021dec.onnx
  min_face_size: 32
  interval_seconds: 1          # look for a face on each tracked person this often
  max_per_track: 5             # keep a person's 5 clearest faces per visit, not one per second
  min_sharpness: 15            # skip blurred faces (sharp ~30-300, motion blur < 10)
  max_turn: 0.6                # skip faces turned away (0 = facing the camera, 0.5 ~ 60 deg)

# Body poses (17 keypoints per tracked person, about once a second): posture, hands up, facing,
# head down, still / walking / running, bags carried, top / bottom colour, searchable with the chat's `people` tool and GET /people. Not biometric
# like faces, but a walk can still be recognised: same retention as the search index.
# Model: `uv run --group export src/export_pose.py` in ../object-detection (ViTPose-B, COCO only,
# Apache-2.0). Missing model: everything else is still recorded, with a warning.
pose:
  enabled: true
  cameras: []                  # empty = every camera
  model: ../object-detection/models/pose_vitpose_b.onnx   # trials: pose_rtmpose_t.onnx (10x faster)
  interval_seconds: 1          # per tracked person; 3x less often while they stand still
  min_box_height: 80           # pixels: smaller people give unreliable keypoints
  heartbeat_seconds: 10        # a row on every change, and at least this often
  store_keypoints: true        # 102 bytes a row: new facts can be derived later without the model
  alerts: [down]               # down (lying for down_seconds) | hands_up (both hands up)
  down_seconds: 10
  hands_up_seconds: 3
