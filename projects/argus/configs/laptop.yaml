# Testing on a laptop: its webcam is the only camera, faces are on, nothing else to set up.
# Its own store, so test data never mixes with a site's.
#
#   uv run --group ui -m argus.ui --config configs/laptop.yaml   # http://127.0.0.1:7860

source: 0  # webcam index (1, 2... for a USB camera)

model:
  backend: yolox_onnx
  # Nano keeps a laptop demo fluid (~10 ms a frame). Sites use yolox_s.onnx (default.yaml);
  # yolox_m.onnx on a GPU. Better on small and far objects, slower: see DOCUMENTATION.md, 15.1.
  path: models/yolox_nano.onnx
  conf_threshold: 0.25
  nms_threshold: 0.45
  class_agnostic_nms: true
  classes: null

tracking:
  track_threshold: 0.45
  max_missed: 30
  min_hits: 3

# The webcam is not an IP camera: no url/host, only what the chat should know about it.
cameras:
  laptop:
    about:
      description: Laptop webcam on the desk, facing the person using the laptop
      aliases: [webcam, desk]
      covers: room
      faces: good

store:
  path: data/store/laptop.db
  media_dir: data/store/laptop_media
  retention_days: 7
  face_retention_days: 7

# Visual search by description needs the CLIP models (see the README). Without
# them, objects and faces are still recorded and searchable.
search:
  enabled: true
  clip:
    image: models/clip_image.onnx
    text: models/clip_text.onnx
    vocab: models/clip_bpe_vocab.txt.gz
  classes: [person, backpack, handbag, suitcase, cell phone, laptop, cup, bottle, book, chair]
  object_interval_seconds: 2
  scene_interval_seconds: 5
  scene_tiles: 2
  min_box_height: 40

faces:
  enabled: true
  cameras: [laptop]
  detector: models/face_detection_yunet_2023mar.onnx
  recognizer: models/face_recognition_sface_2021dec.onnx
  min_face_size: 32
  interval_seconds: 1
  max_per_track: 5
  min_sharpness: 15
  max_turn: 0.6

# Periodic reports (Reports tab: "Make it now"; on schedule with `uv run -m argus.report
# --config configs/laptop.yaml`). No channels: saved only.
reports:
  - name: hourly
    every: hourly
    interests: [anyone at the desk, a phone or a bag left on the desk]

chat:
  model: local
  models:
    local:
      api: openai
      base_url: http://127.0.0.1:11434/v1   # Ollama: `ollama pull qwen3:4b`
      model: qwen3:4b
      temperature: 0.2
      note: Qwen3 4B · Apache-2.0 · 2.5 GB · CPU
    qwen3.5-4b:                             # `ollama pull qwen3.5:4b`
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: qwen3.5:4b
      temperature: 0.2
      note: Qwen3.5 4B · Apache-2.0 · 3.4 GB · CPU · tools + vision
    granite-3b:                             # `ollama pull granite4.1:3b`
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: granite4.1:3b
      temperature: 0.2
      note: IBM Granite 4.1 3B · Apache-2.0 · 2.1 GB · CPU · tuned for tool use
    gemma4-e4b:                             # `ollama pull gemma4:e4b`
      api: openai
      base_url: http://127.0.0.1:11434/v1
      model: gemma4:e4b
      temperature: 0.2
      note: Gemma 4 E4B · Apache-2.0 · 6.6 GB · CPU · tools + vision
    claude:
      api: anthropic                        # uv sync --group claude; ANTHROPIC_API_KEY in .env
      model: claude-opus-5-5
      effort: low
      note: Claude Opus 5.5 · Anthropic API (cloud)
  vision:                                   # `look` tool: `ollama pull qwen3.5:4b`
    enabled: true
    model: qwen3.5:4b
    base_url: http://127.0.0.1:11434/v1
    max_images: 4
    max_side: 640

# Body poses: the skeleton on the live view, posture / hands up / colours in the store, and a
# `down` alert after 10 s lying. Model: `uv run --group export -m argus.engine.export_pose`
# (or the faster trial model: download_model.py pose_rtmpose_t).
pose:
  enabled: true
  model: models/pose_vitpose_b.onnx
  interval_seconds: 1
  min_box_height: 80
  alerts: [down, hands_up]
  down_seconds: 10
  hands_up_seconds: 3

# Number plates: `uv run -m argus.engine.download_model plates`, then enabled: true (a webcam
# rarely sees one; try a video of a car park as the source).
plates:
  enabled: false
  interval_seconds: 1
  min_plate_width: 30
  watchlist: []

# Sound events (camera microphones; needs ffmpeg): `uv run -m argus.engine.download_model
# sounds`, then enabled: true. Recording a video file with sound works too.
sounds:
  enabled: false

# Rules without a model: put your hand over the webcam for 20 s (tamper: blocked), or leave a
# backpack in view and step away for 30 s (abandoned).
tamper:
  enabled: true
  hold_seconds: 20
abandoned:
  enabled: true
  seconds: 30
