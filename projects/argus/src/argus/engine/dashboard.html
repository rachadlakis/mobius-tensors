<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<link rel="icon" href="/favicon.svg">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f7fb; --card: #ffffff; --ink: #0b1230; --muted: #5b6478; --line: #dde3ee;
  --soft: #eef2fa; --blue: #2864ff; --cyan: #0e86b8;
  --ok: #1f8a4c; --ok-bg: #e5f5ec; --bad: #d6453d; --bad-bg: #fcebea;
  --warn: #a66a00; --warn-bg: #fdf3dc; --grey-bg: #eceff4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070c20; --card: #0f1733; --ink: #eef2ff; --muted: #9aa4c0; --line: #25304f;
    --soft: #16203f; --blue: #5b8bff; --cyan: #6fd8f7;
    --ok: #4cc382; --ok-bg: #12301f; --bad: #ff7b72; --bad-bg: #3a1716;
    --warn: #f0b84a; --warn-bg: #3a2c0c; --grey-bg: #1c2645;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--blue); }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px;
  letter-spacing: .02em; }
header .brand img { width: 30px; height: 30px; }
#live { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center;
  gap: 6px; }
#live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
#live.down .dot { background: var(--bad); }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0 0 10px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }

/* cameras */
#cameras { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px; margin-bottom: 22px; }
.cam { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.cam .top { display: flex; align-items: center; gap: 8px; }
.cam .name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.cam .state { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.state.on { background: var(--ok-bg); color: var(--ok); }
.state.off { background: var(--bad-bg); color: var(--bad); }
.cam .seen, .cam .alerts { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--soft); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
.tamper { background: var(--bad-bg); color: var(--bad); border-radius: 6px; padding: 4px 8px;
  font-size: 12px; font-weight: 600; }

/* layout */
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 18px;
  align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

/* alerts */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.filters select { border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 6px 8px; }
#count { color: var(--muted); font-size: 13px; align-self: center; margin-left: auto; }
#events { display: flex; flex-direction: column; gap: 8px; }
.ev { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; padding: 10px;
  border-left: 4px solid var(--line); }
.ev.high { border-left-color: var(--bad); }
.ev.new { animation: flash 2.5s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--blue) 18%, var(--card)); } }
.ev .shot { width: 128px; height: 80px; border-radius: 8px; background: var(--soft);
  object-fit: cover; cursor: zoom-in; border: 0; padding: 0; display: block; }
.ev .shot.none { display: grid; place-items: center; color: var(--muted); font-size: 22px;
  cursor: default; }
.ev .title { font-weight: 600; font-size: 15px; }
.ev .meta { color: var(--muted); font-size: 13px; }
.ev .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.badge { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; }
.badge.yes { background: var(--ok-bg); color: var(--ok); }
.badge.no { background: var(--bad-bg); color: var(--bad); }
.badge.unsure { background: var(--warn-bg); color: var(--warn); }
.badge.other { background: var(--grey-bg); color: var(--muted); }
.reason { color: var(--muted); font-size: 13px; font-style: italic; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 520px) {
  .ev { grid-template-columns: 1fr; }
  .ev .shot { width: 100%; height: 160px; }
  header { padding: 10px 16px; } main { padding: 14px 16px 32px; }
}

/* side tools */
aside { display: flex; flex-direction: column; gap: 18px; }
.tool { padding: 14px; }
.tool form { display: flex; gap: 6px; margin-bottom: 10px; }
.tool input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg);
  border-radius: 8px; padding: 7px 10px; }
.hint { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.res { font-size: 11px; color: var(--muted); }
.res button { width: 100%; aspect-ratio: 3 / 4; border: 0; padding: 0; border-radius: 6px;
  overflow: hidden; background: var(--soft); cursor: zoom-in; display: block; }
.res img { width: 100%; height: 100%; object-fit: cover; display: block; }
.plates { display: flex; flex-direction: column; gap: 8px; }
.plate { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; }
.plate img { width: 96px; height: 32px; object-fit: contain; background: var(--soft);
  border-radius: 4px; }
.plate b { font-family: Consolas, monospace; font-size: 15px; letter-spacing: .05em; }
.msg { color: var(--muted); font-size: 13px; }

/* viewer */
dialog { border: 0; border-radius: 12px; padding: 0; background: var(--card); color: var(--ink);
  max-width: min(1100px, 94vw); }
dialog::backdrop { background: rgba(4, 8, 24, .75); }
dialog img { display: block; max-width: 100%; max-height: 78vh; }
dialog .cap { padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
dialog .cap .btn { margin-left: auto; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/favicon.svg" alt="">Argus</div>
  <div id="live"><span class="dot"></span><span id="live-text">Connecting…</span></div>
  <form method="post" action="/logout" id="logout" hidden><button class="btn" type="submit">Sign out</button></form>
</header>

<main>
  <h2>Cameras</h2>
  <section id="cameras" aria-live="polite"></section>

  <div class="cols">
    <section>
      <h2>Alerts</h2>
      <div class="filters">
        <select id="f-range" aria-label="Time range">
          <option value="today">Today</option>
          <option value="24">Last 24 hours</option>
          <option value="168">Last 7 days</option>
        </select>
        <select id="f-camera" aria-label="Camera"><option value="">All cameras</option></select>
        <select id="f-type" aria-label="Alert type"><option value="">All types</option></select>
        <select id="f-verdict" aria-label="Check verdict">
          <option value="">Sent and held back</option>
          <option value="sent">Sent only</option>
          <option value="no">Held back only</option>
        </select>
        <span id="count"></span>
      </div>
      <div id="events"></div>
    </section>

    <aside>
      <div class="card tool">
        <h2>Find by description</h2>
        <form id="search-form">
          <input id="search-q" placeholder="white van at the gate yesterday" aria-label="Description">
          <button class="btn primary" type="submit">Search</button>
        </form>
        <p class="hint">Ranked best matches, not certainties. Time and camera can be in the words.</p>
        <div id="search-out" class="results"></div>
      </div>
      <div class="card tool">
        <h2>Number plate</h2>
        <form id="plate-form">
          <input id="plate-q" placeholder="AB 123 CD" aria-label="Plate">
          <button class="btn primary" type="submit">Find</button>
        </form>
        <p class="hint">Look-alike characters (0/O, 8/B…) and one wrong character are forgiven.</p>
        <div id="plate-out" class="plates"></div>
      </div>
    </aside>
  </div>
</main>

<dialog id="viewer">
  <img id="viewer-img" alt="">
  <div class="cap"><span id="viewer-cap"></span><a id="viewer-video" target="_blank" rel="noopener">Open video</a>
    <button class="btn" type="button" id="viewer-close">Close</button></div>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const HIGH = new Set(["down", "abandoned", "tamper", "sound", "plate", "hands_up"]);
const TYPE_NAMES = { enter: "Entered", exit: "Left", dwell: "Stayed", cross: "Crossed",
  crowd: "Crowding", down: "Person down", hands_up: "Hands up", abandoned: "Left unattended",
  tamper: "Camera tampering", sound: "Sound", plate: "Watchlist plate" };
const VERDICT = { yes: ["yes", "Checked: real"], no: ["no", "Held back"],
  unsure: ["unsure", "Checked: unsure"], error: ["other", "Not checked (model error)"],
  skipped: ["other", "Not checked (busy)"] };
let seen = null;          // event ids already shown (null before the first load)
let lastEvents = [];

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}

async function api(path) {
  const r = await fetch(path, { credentials: "same-origin", cache: "no-store" });
  if (r.status === 401) { location.reload(); throw new Error("signed out"); }
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return r.json();
}

function ago(seconds) {
  if (seconds === null || seconds === undefined) return "nothing recorded yet";
  if (seconds < 60) return `${seconds} s ago`;
  if (seconds < 3600) return `${Math.round(seconds / 60)} min ago`;
  if (seconds < 86400) return `${Math.round(seconds / 3600)} h ago`;
  return `${Math.round(seconds / 86400)} days ago`;
}

function when(iso) {
  const d = new Date(iso), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  if (d.toDateString() === now.toDateString()) return time;
  return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + " " + time;
}

function title(e) {
  const label = e.label ? e.label[0].toUpperCase() + e.label.slice(1) : "Object";
  const rule = (e.rule || "").replaceAll("_", " ");
  switch (e.type) {
    case "enter": return `${label} entered ${rule}`;
    case "exit": return `${label} left ${rule}`;
    case "dwell": return `${label} stayed ${Math.round(e.dwell_seconds || 0)} s in ${rule}`;
    case "cross": return `${label} crossed ${rule}${e.direction ? " (" + e.direction + ")" : ""}`;
    case "crowd": return `${e.count || "Many"} × ${e.label || "objects"} in ${rule}`;
    case "down": return "Person down";
    case "hands_up": return "Hands up";
    case "abandoned": return `${label} left unattended`;
    case "tamper": return `Camera ${rule}`;
    case "sound": return `Sound: ${rule}`;
    case "plate": return `Watchlist plate ${e.plate || ""} (${rule})`;
    default: return `${TYPE_NAMES[e.type] || e.type} ${rule}`;
  }
}

function openViewer(src, caption, video) {
  $("viewer-img").src = src;
  $("viewer-cap").textContent = caption;
  const v = $("viewer-video");
  if (video) { v.href = video; v.hidden = false; } else { v.hidden = true; }
  $("viewer").showModal();
}
$("viewer-close").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("click", (ev) => { if (ev.target === $("viewer")) $("viewer").close(); });

// ------------------------------------------------------------------ cameras

async function loadStatus() {
  const s = await api("/status");
  $("logout").hidden = !s.login;
  const box = $("cameras");
  box.replaceChildren();
  if (!s.cameras.length) {
    box.append(el("div", { class: "card empty", text: "No camera has recorded anything yet." }));
  }
  const select = $("f-camera"), current = select.value;
  select.replaceChildren(el("option", { value: "", text: "All cameras" }));
  for (const c of s.cameras) {
    select.append(el("option", { value: c.camera, text: c.camera }));
    const counts = Object.entries(c.tracked_today);
    const total = c.alerts_today.total, held = c.alerts_today.held_back;
    box.append(el("div", { class: "card cam" },
      el("div", { class: "top" },
        el("span", { class: "name", text: c.camera, title: c.camera }),
        el("span", { class: "state " + (c.online ? "on" : "off"), text: c.online ? "Online" : "Offline" })),
      el("div", { class: "seen", text: "Last activity " + ago(c.seconds_ago) }),
      counts.length ? el("div", { class: "chips" },
        ...counts.slice(0, 6).map(([k, n]) => el("span", { class: "chip", text: `${k} ${n}` })))
        : el("div", { class: "seen", text: "Nothing tracked today" }),
      el("div", { class: "alerts", text: `${total} alert${total === 1 ? "" : "s"} today` +
        (held ? ` · ${held} held back` : "") }),
      c.tamper ? el("div", { class: "tamper",
        text: `Tamper: ${c.tamper.rule} at ${when(c.tamper.iso_time)}` }) : null));
  }
  select.value = current;
}

// ------------------------------------------------------------------ alerts

function since() {
  const v = $("f-range").value, d = new Date();
  if (v === "today") d.setHours(0, 0, 0, 0); else d.setTime(d.getTime() - Number(v) * 3600e3);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`;
}

async function loadEvents() {
  const q = new URLSearchParams({ since: since(), limit: "300" });
  if ($("f-camera").value) q.set("camera", $("f-camera").value);
  const data = await api("/events?" + q);
  lastEvents = data.events;
  renderEvents();
}

function renderEvents() {
  const type = $("f-type").value, verdict = $("f-verdict").value;
  const types = new Set(lastEvents.map((e) => e.type));
  const tSel = $("f-type"), tCur = tSel.value;
  tSel.replaceChildren(el("option", { value: "", text: "All types" }),
    ...[...types].sort().map((t) => el("option", { value: t, text: TYPE_NAMES[t] || t })));
  tSel.value = types.has(tCur) ? tCur : "";
  const shown = lastEvents.filter((e) => (!type || e.type === type) &&
    (!verdict || (verdict === "no" ? e.verified === "no" : e.verified !== "no")));
  const held = lastEvents.filter((e) => e.verified === "no").length;
  $("count").textContent = `${shown.length} shown` + (held ? ` · ${held} held back` : "");
  const box = $("events");
  box.replaceChildren();
  if (!shown.length) box.append(el("div", { class: "card empty", text: "No alerts in this range." }));
  for (const e of shown) {
    const fresh = seen !== null && !seen.has(e.id);
    const caption = `${title(e)} · ${e.camera} · ${when(e.iso_time)}`;
    const shot = e.snapshot_url
      ? el("button", { class: "shot", type: "button", "aria-label": "Open snapshot",
          onclick: () => openViewer(e.snapshot_url, caption, e.video_url) },
          el("img", { class: "shot", src: e.snapshot_url, alt: "", loading: "lazy" }))
      : el("div", { class: "shot none", text: e.type === "sound" ? "♪" : "–" });
    const v = VERDICT[e.verified];
    box.append(el("article", { class: "card ev" + (HIGH.has(e.type) ? " high" : "") + (fresh ? " new" : "") },
      shot,
      el("div", {},
        el("div", { class: "title", text: title(e) }),
        el("div", { class: "meta", text: `${e.camera} · ${when(e.iso_time)}` +
          (e.track_id !== undefined ? ` · #${e.track_id}` : "") +
          (e.type === "sound" && e.label ? ` · heard: ${e.label}` : "") }),
        el("div", { class: "row" },
          v ? el("span", { class: "badge " + v[0], text: v[1] }) : null,
          e.video_url ? el("a", { href: e.video_url, target: "_blank", rel: "noopener", text: "Video" }) : null),
        e.verification ? el("div", { class: "reason", text: "“" + e.verification + "”" }) : null)));
  }
  seen = new Set(lastEvents.map((e) => e.id));
}
for (const id of ["f-range", "f-camera"]) $(id).addEventListener("change", () => { seen = null; refresh(); });
for (const id of ["f-type", "f-verdict"]) $(id).addEventListener("change", renderEvents);

// ------------------------------------------------------------------ search and plates

$("search-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("search-q").value.trim(), out = $("search-out");
  if (!q) return;
  out.replaceChildren(el("div", { class: "msg", text: "Searching…" }));
  try {
    const r = await api("/search?" + new URLSearchParams({ q, limit: "24" }));
    out.replaceChildren();
    if (!r.results.length) out.append(el("div", { class: "msg", text: "Nothing found." }));
    for (const m of r.results) {
      const cap = `${m.camera} · ${when(m.first_seen)}` + (m.label ? ` · ${m.label}` : "");
      out.append(el("div", { class: "res" },
        el("button", { type: "button", "aria-label": "Open", onclick: () => openViewer(m.thumb_url, cap, m.video_url) },
          el("img", { src: m.thumb_url, alt: m.label || "", loading: "lazy" })),
        el("div", { text: `${m.camera} · ${when(m.first_seen)}` })));
    }
  } catch (e) { out.replaceChildren(el("div", { class: "msg", text: e.message })); }
});

$("plate-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const plate = $("plate-q").value.trim(), out = $("plate-out");
  if (!plate) return;
  out.replaceChildren(el("div", { class: "msg", text: "Looking…" }));
  try {
    const r = await api("/plates?" + new URLSearchParams({ plate, limit: "20" }));
    out.replaceChildren();
    if (!r.results.length) out.append(el("div", { class: "msg", text: "No vehicle with that plate." }));
    for (const v of r.results) {
      out.append(el("div", { class: "plate" },
        v.thumb_url ? el("img", { src: v.thumb_url, alt: v.plate || "" }) : el("span"),
        el("div", {}, el("b", { text: v.plate || "" }),
          el("div", { class: "msg", text: `${v.camera} · ${when(v.first_seen)}` + (v.match === "close" ? " · close match" : "") }))));
    }
  } catch (e) { out.replaceChildren(el("div", { class: "msg", text: e.message })); }
});

// ------------------------------------------------------------------ refresh loop

async function refresh() {
  try {
    await Promise.all([loadStatus(), loadEvents()]);
    $("live").classList.remove("down");
    $("live-text").textContent = "Live · updated " + new Date().toLocaleTimeString();
  } catch (e) {
    if (e.message === "signed out") return;
    $("live").classList.add("down");
    $("live-text").textContent = "Can't reach the server: " + e.message;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
