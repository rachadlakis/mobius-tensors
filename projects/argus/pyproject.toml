[project]
name = "argus"
version = "0.1.0"
description = "Record everything the cameras see as searchable embeddings, then ask about it"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps of the object-detection modules Argus reuses (detector, tracker, CLIP, store).
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
]

[dependency-groups]
# ONNX Runtime: the CPU build by default; on an NVIDIA machine swap it for the GPU one
# (CUDA and cuDNN come as wheels, only the driver is needed): uv sync --no-group cpu --group gpu
cpu = [
    "onnxruntime>=1.30.0",
]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.30.0; sys_platform != 'darwin'",
]
claude = [
    "anthropic>=1.11.0",
]
dev = [
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]
ui = [
    "gradio>=6.28.0",
]

[tool.uv]
default-groups = ["cpu", "dev"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
