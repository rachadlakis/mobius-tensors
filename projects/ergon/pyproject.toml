[project]
name = "ergon"
version = "0.1.0"
description = "Ergon by Mobius Tensors: a team of AI employees led by a Chief of Staff."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[mcp,db]>=1.2.1,<3",  # [mcp]: `mcp` client SDK (shared/config.py); [db]: SQLAlchemy for DatabaseSessionService. Tested on 2.x; cap below the next major - ADK makes breaking changes on majors.
    "a2a-sdk[http-server]>=0.2.5,<1.0.0",  # 1.0.0 rewrote a2a.types from pydantic to protobuf; code here targets the pydantic API
    "nest-asyncio>=1.6.0",
    "python-dotenv",
    "click",
    "uvicorn",
    "litellm",
    "httpx",
    "fpdf2",
    "aiosqlite",  # async SQLite driver for DatabaseSessionService (SESSION_BACKEND=database)
    "ddgs",         # keyless DuckDuckGo search for the Researcher (shared/web_tools.py)
    "trafilatura",  # main-content extraction for scraped pages
    "openpyxl",     # read user-uploaded .xlsx and convert to CSV text (shared/attachments.py)
    "pyyaml",       # employees/*.yaml (shared/employees.py)
    "python-docx",  # Word documents (shared/documents.py)
    "pandas",       # run_python: the Data Analyst's scripts (shared/sandbox.py)
    "matplotlib",   # run_python: charts
    "claude-agent-sdk",  # the Engineer: Claude Code on its own branch (shared/coding.py)
]

[project.optional-dependencies]
dev = ["ipykernel", "nbconvert", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.ipynb"]  # the playground notebook is exploratory, not linted

[tool.ruff.lint]
# Deliberately narrow: pyflakes (real bugs - undefined names, unused imports)
# and import sorting. Not pycodestyle line-length etc. - the agent instructions
# and docstrings are intentionally long.
select = ["F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:google.adk.features._feature_decorator",
    "ignore:Using .httpx. with .starlette.testclient.:Warning",
    "ignore:.*GEMINI_VIA_LITELLM.*:UserWarning",
]

[tool.setuptools.packages.find]
include = [
    "shared*",
    "orchestrator_agent*",
]
